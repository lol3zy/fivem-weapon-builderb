name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'weapon_pack_builder.py'
      - 'FiveM_Weapon_Pack_Builder.spec'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python for the build machine only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FiveM_Weapon_Pack_Builder weapon_pack_builder.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveM_Weapon_Pack_Builder-Windows
          path: dist/FiveM_Weapon_Pack_Builder.exe
          if-no-files-found: error
          retention-days: 30
